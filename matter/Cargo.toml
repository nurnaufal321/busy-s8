[package]
name = "busy-matter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The BUSY S8's smart-home switch as a Matter device (rs-matter), run by the Android app"
publish = false

[[bin]]
name = "busy-matter"
path = "src/main.rs"

[dependencies]
# Pinned to the commit tested on the S8 (2026-10-28).
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "1c01ee7f6f1dab2ef6fe4396afedd26e38ad79f2", features = ["async-io", "groups", "persistent-subscriptions", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }
log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
if-addrs = "0.15"
async-io = "2"
futures-lite = "2"
async-channel = "2"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
socket2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
